  <line x1="4" y1="28" x2="52" y2="28" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Oracle wordmark -->
  <text x="62" y="24" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a1a1a" letter-spacing="1.5">ORACLE</text>
  <!-- MICROS label -->
